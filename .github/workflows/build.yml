name: Build

# Builds the polaris image in full: the device binaries with the NDK, the
# packer on the host, and then the image on top of the phone's own stock
# recovery, checked before it is published.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Notes and documents alone do not need an image built.
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to publish when the build passes; empty for no release"
        required: false
        default: ""

permissions:
  contents: write

env:
  DEVICE: polaris
  DEVICE_NAME: Xiaomi MIX 2S
  DEVICE_OS: InfinityX (Android 16), kernel 4.19
  # The recovery partition takes 64 MiB, as the phone's own table gives it.
  PARTITION_SIZE: "67108864"
  # The base this is built on: OrangeFox R11.1 for polaris, whose kernel and
  # ramdisk are the pair that boots on this phone's firmware. It carries a
  # full recovery userspace (Android 11 libraries) that an Android 16 system
  # can be read from, where the stock MIUI recovery's Android 10 one cannot.
  STOCK_URL: https://github.com/lcrlcr666/skywardMIX2s/releases/download/polaris-base/orange-fox-polaris.img
  STOCK_SHA256: "d2a24292f005d1f912bd5b752715ee54e32c371154500360dbb160f360d69bc0"

jobs:
  build:
    name: Build the recovery
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Install what the image needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lz4 zip
          python3 -m pip install --quiet fonttools

      - name: Free disk before the image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Keep the stock recovery between runs
        uses: actions/cache@v4
        with:
          path: stock/recovery.img
          key: base-${{ env.DEVICE }}-offox-v1

      - name: Take the phone's own recovery
        run: |
          if [ -s stock/recovery.img ]; then
            echo "the stock recovery is already here"
          else
            mkdir -p stock
            curl -sSL --retry 5 --retry-delay 3 -o stock/recovery.img "$STOCK_URL"
          fi
          ls -l stock/recovery.img
          if [ -n "$STOCK_SHA256" ]; then
            echo "$STOCK_SHA256  stock/recovery.img" | sha256sum -c -
          else
            echo "no SHA-256 pinned for the stock recovery; what it holds is checked below"
            test "$(stat -c%s stock/recovery.img)" -gt 40000000
          fi

      - name: Build the image
        run: STOCK=stock/recovery.img OUT=out/skyward-$DEVICE.img ./scripts/build.sh

      - name: Check the image the phone would start
        run: |
          python3 scripts/verify-image.py "out/skyward-$DEVICE.img" \
            --expect-recovery-bytes "$PARTITION_SIZE"

      # What this names is a reason the phone would refuse to load the
      # program, which no build flag here can fix; it is reported, and the
      # image is still published so it can be tried.
      - name: Check the programs against the phone's own libraries
        continue-on-error: true
        run: |
          python3 scripts/check-symbols.py \
            target/aarch64-linux-android/release/skyward \
            stock/recovery.img \
            target/system-init/aarch64-linux-android/release/system-init

      - name: Name and sum what came out
        id: name
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "${{ inputs.release }}" ]; then
            tag="${{ inputs.release }}"
          else
            tag="polaris-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          img="skyward-$DEVICE-V12.5.1.0.QDGCNXM.img"
          cp "out/skyward-$DEVICE.img" "out/$img"
          (cd out && zip -9 "skyward-$DEVICE-V12.5.1.0.QDGCNXM.zip" "$img")
          (cd out && sha256sum "$img" "skyward-$DEVICE-V12.5.1.0.QDGCNXM.zip" > SHA256SUMS)
          cat out/SHA256SUMS
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: skyward-${{ env.DEVICE }}-image
          path: |
            out/skyward-${{ env.DEVICE }}-V12.5.1.0.QDGCNXM.zip
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      # The way back: the phone's own recovery partition, so it can be put
      # back with one fastboot command after Skyward is tried.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE }}-stock-recovery
          path: stock/recovery.img
          if-no-files-found: error
          retention-days: 90

      - name: Publish the release
        if: github.ref_type == 'tag' || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$DEVICE_NAME ($DEVICE) $TAG on $DEVICE_OS" \
            --notes "Skyward recovery for $DEVICE_NAME ($DEVICE), built on the phone's own stock recovery of $DEVICE_OS." \
            "out/skyward-$DEVICE-V12.5.1.0.QDGCNXM.zip" \
            "out/SHA256SUMS"
