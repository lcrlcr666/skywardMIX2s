name: Tools

# Small programs the recovery needs besides its own: the userspace half of the
# phone's WLAN firmware bring-up, which downstream icnss kernels leave to
# userspace and Android does with its own closed daemon.
on:
  workflow_dispatch:

jobs:
  tools:
    name: Build the WLAN bring-up tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross make git ca-certificates
          # The mapper links the QRTR library and the xz decompressor, for the
          # architecture it will run on.
          sudo apt-get install -y --no-install-recommends libqrtr-dev:arm64 liblzma-dev:arm64 || \
            echo "no packaged QRTR for the target"
          ls /usr/lib/aarch64-linux-gnu/ 2>/dev/null | grep -E 'qrtr|lzma' | head -5 || true
          aarch64-linux-gnu-gcc --version | head -1

      - name: Get the sources
        run: |
          git clone --depth 1 https://github.com/linux-msm/qrtr.git qrtr
          git clone --depth 1 https://github.com/linux-msm/pd-mapper.git pd-mapper
          echo "== qrtr"; ls qrtr qrtr/lib qrtr/src qrtr/include
          echo "== pd-mapper"; ls pd-mapper

      - name: Build
        run: |
          mkdir -p out
          # Static, so they run in a recovery whose own C library is older than
          # the one they were built against.
          aarch64-linux-gnu-gcc -O2 -static -Wall -Wextra -o out/wlfwd wlfwd/wlfwd.c
          aarch64-linux-gnu-gcc -O2 -static -Wall -Wextra -o out/pdr-restart wlfwd/pdr-restart.c || true

          # pd-mapper is what tells the modem which protection domains exist
          # and where their firmware is; without it the WLAN domain never
          # starts and its service never appears on the name service.
          aarch64-linux-gnu-gcc -O2 -Wall \
            -I qrtr/include -I pd-mapper \
            -o out/pd-mapper \
            pd-mapper/pd-mapper.c pd-mapper/assoc.c pd-mapper/json.c \
            pd-mapper/servreg_loc.c pd-mapper/lzma_decomp.c \
            -lqrtr -llzma 2>&1 | head -50 || true
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: wlfwd
          path: out/
          if-no-files-found: error
          retention-days: 30
