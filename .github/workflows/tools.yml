name: Tools

# Small programs the recovery needs besides its own: the userspace half of the
# phone's WLAN firmware bring-up, which downstream icnss kernels leave to
# userspace and Android does with its own closed daemon.
on:
  workflow_dispatch:

jobs:
  tools:
    name: Build the WLAN bring-up tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross make git curl ca-certificates
          aarch64-linux-gnu-gcc --version | head -1

      - name: Get the sources
        run: |
          git clone --depth 1 https://github.com/linux-msm/pd-mapper.git pd-mapper
          git clone --depth 1 https://github.com/linux-msm/rmtfs.git rmtfs
          git clone --depth 1 https://github.com/linux-msm/tqftpserv.git tqftpserv
          # The QRTR library ships in the distribution's source, not in the
          # project's own repository.
          curl -sSL -o qrtr.tar.gz http://archive.ubuntu.com/ubuntu/pool/main/q/qrtr/qrtr_1.2.orig.tar.gz
          tar -xzf qrtr.tar.gz
          echo "== qrtr"; ls qrtr-1.2 qrtr-1.2/lib qrtr-1.2/include
          echo "== pd-mapper"; ls pd-mapper
          echo "== rmtfs"; ls rmtfs
          echo "== tqftpserv"; ls tqftpserv
          # On this phone there is no remote processor class for the mapper to
          # read map names from, so it reads the domain files straight out of
          # the firmware directory instead.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("pd-mapper/pd-mapper.c")
          t = p.read_text()
          old = '''\tclass_fd = open("/sys/class/remoteproc", O_RDONLY | O_DIRECTORY);
          \tif (class_fd < 0) {
          \t\twarn("failed to open remoteproc class");
          \t\treturn -1;
          \t}
          '''
          new = '''\tclass_fd = open("/sys/class/remoteproc", O_RDONLY | O_DIRECTORY);
          \tif (class_fd < 0) {
          \t\tDIR *local = opendir("/vendor/firmware_mnt/image");
          \t\tstruct dirent *entry;
          \t\tif (!local) {
          \t\t\twarn("failed to open remoteproc class");
          \t\t\treturn -1;
          \t\t}
          \t\twhile ((entry = readdir(local)) != NULL) {
          \t\t\tsize_t l = strlen(entry->d_name);
          \t\t\tif (l < 5 || strcmp(entry->d_name + l - 4, ".jsn"))
          \t\t\t\tcontinue;
          \t\t\tif (strlen("/vendor/firmware_mnt/image") + 1 + l + 1 > sizeof(json_path))
          \t\t\t\tcontinue;
          \t\t\tstrcpy(json_path, "/vendor/firmware_mnt/image/");
          \t\t\tstrcat(json_path, entry->d_name);
          \t\t\tassoc_set(json_set, json_path, NULL);
          \t\t}
          \t\tclosedir(local);
          \t\treturn 0;
          \t}
          '''
          if old in t:
              p.write_text(t.replace(old, new, 1))
              print("mapper reads the firmware directory directly")
          else:
              print("mapper patch did not match")
          PY
          # Say which map file was tried and why it failed, so a silent zero
          # can be told apart from a parse failure.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("pd-mapper/pd-mapper.c")
          t = p.read_text()
          old = "\tret = pd_load_map(jsn);\n\t\tif (ret < 0)\n\t\t\tbreak;"
          new = "\tfprintf(stderr, \"loading map %s\\n\", jsn);\n\t\tret = pd_load_map(jsn);\n\t\tif (ret < 0) {\n\t\t\tfprintf(stderr, \"map %s failed: %d\\n\", jsn, ret);\n\t\t\tbreak;\n\t\t}"
          if old in t:
              p.write_text(t.replace(old, new, 1))
              print("map loading is now reported")
          else:
              print("map report patch did not match")
          PY

      - name: Build
        run: |
          mkdir -p out/fake
          # Static, so they run in a recovery whose own C library is older than
          # the one they were built against.
          aarch64-linux-gnu-gcc -O2 -static -Wall -Wextra -o out/wlfwd wlfwd/wlfwd.c
          # The modem is started by opening its node and keeping it open; the
          # node refuses to open while the subsystem is still going down, so the
          # open is retried until the state settles.
          cat > out/modemhold.c <<'EOF'
          #include <fcntl.h>
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>
          int main(void)
          {
          	const char *state_path = "/sys/bus/msm_subsys/devices/subsys0/state";
          	const char *node = "/dev/subsys_modem";
          	char state[32];
          	int fd, tries;
          	for (tries = 0; tries < 900; tries++) {
          		FILE *f = fopen(state_path, "r");
          		state[0] = 0;
          		if (f) { if (!fgets(state, sizeof(state), f)) state[0] = 0; fclose(f); }
          		if (strncmp(state, "OFFLINE", 7) == 0) {
          			fd = open(node, O_RDONLY);
          			if (fd >= 0) {
          				printf("modem opened, holding\n");
          				fflush(stdout);
          				for (;;) pause();
          			}
          		}
          		sleep(2);
          	}
          	printf("gave up waiting for the modem\n");
          	return 1;
          }
          EOF
          aarch64-linux-gnu-gcc -O2 -static -Wall -o out/modemhold out/modemhold.c 2>&1 | head -10 || true
          aarch64-linux-gnu-gcc -O2 -static -Wall -Wextra -o out/pdr-restart wlfwd/pdr-restart.c || true

          # pd-mapper is what tells the modem which protection domains exist
          # and where their firmware is; without it the WLAN domain never
          # starts and its service never appears on the name service. Its JSON
          # reader includes the xz header without using it, and the phone's
          # domain files are plain, so the decompressor is stubbed out.
          echo '/* not needed: the domain files here are plain */' > out/fake/lzma.h
          cat > out/fake/lzma_decomp.c <<'EOF'
          int lzma_decomp(const char *file) { (void)file; return -1; }
          EOF
          aarch64-linux-gnu-gcc -O2 -static -Wall \
            -I out/fake -I qrtr-1.2/include -I pd-mapper \
            -o out/pd-mapper \
            pd-mapper/pd-mapper.c pd-mapper/assoc.c pd-mapper/json.c \
            pd-mapper/servreg_loc.c out/fake/lzma_decomp.c \
            qrtr-1.2/lib/qrtr.c qrtr-1.2/lib/qmi.c qrtr-1.2/lib/logging.c 2>&1 | head -50 || true

          # rmtfs hands the modem the files it asks for over shared memory, and
          # tqftpserv serves the images it fetches over the network: the two
          # services a protection domain needs before it can start.
          aarch64-linux-gnu-gcc -O2 -static -Wall \
            -I qrtr-1.2/include -I rmtfs \
            -o out/rmtfs \
            rmtfs/rmtfs.c rmtfs/qmi_rmtfs.c rmtfs/qmi_tlv.c rmtfs/storage.c \
            rmtfs/sharedmem.c rmtfs/util.c rmtfs/rproc.c \
            qrtr-1.2/lib/qrtr.c qrtr-1.2/lib/qmi.c qrtr-1.2/lib/logging.c 2>&1 | head -30 || true
          aarch64-linux-gnu-gcc -O2 -static -Wall \
            -I qrtr-1.2/include -I tqftpserv \
            -o out/tqftpserv \
            tqftpserv/*.c \
            qrtr-1.2/lib/qrtr.c qrtr-1.2/lib/qmi.c qrtr-1.2/lib/logging.c 2>&1 | head -30 || true
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: wlfwd
          path: out/
          if-no-files-found: error
          retention-days: 30
