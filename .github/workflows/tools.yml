name: Tools

# Small programs the recovery needs besides its own: the userspace half of the
# phone's WLAN firmware bring-up, which downstream icnss kernels leave to
# userspace and Android does with its own closed daemon.
on:
  workflow_dispatch:

jobs:
  tools:
    name: Build the WLAN bring-up tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross make git curl ca-certificates
          aarch64-linux-gnu-gcc --version | head -1

      - name: Get the sources
        run: |
          git clone --depth 1 https://github.com/linux-msm/pd-mapper.git pd-mapper
          git clone --depth 1 https://github.com/linux-msm/rmtfs.git rmtfs
          git clone --depth 1 https://github.com/linux-msm/tqftpserv.git tqftpserv
          # The QRTR library ships in the distribution's source, not in the
          # project's own repository.
          curl -sSL -o qrtr.tar.gz http://archive.ubuntu.com/ubuntu/pool/main/q/qrtr/qrtr_1.2.orig.tar.gz
          tar -xzf qrtr.tar.gz
          echo "== qrtr"; ls qrtr-1.2 qrtr-1.2/lib qrtr-1.2/include
          echo "== pd-mapper"; ls pd-mapper
          echo "== rmtfs"; ls rmtfs
          echo "== tqftpserv"; ls tqftpserv
          # The locator is patched for this phone: this kernel announces no
          # remote processors to read a firmware path out of, so the domain
          # files are read straight from the firmware directory, and every
          # request is printed so the modem side of the conversation is
          # visible in a log.
          python3 ../scripts/patch-pd-mapper.py pd-mapper


      - name: Build
        run: |
          mkdir -p out/fake
          # Static, so they run in a recovery whose own C library is older than
          # the one they were built against.
          aarch64-linux-gnu-gcc -O2 -static -Wall -Wextra -o out/wlfwd wlfwd/wlfwd.c
          # The modem is started by opening its node and keeping it open.  The
          # open is tried whether or not the subsystem says it is ready: on a cold
          # boot the state reads OFFLINING until the open starts the processor, and a
          # failed open is reported with its errno, which is the only place the reason
          # (no firmware, or a boot still winding down) shows up.
          aarch64-linux-gnu-gcc -O2 -static -Wall -Wextra -o out/modemhold wlfwd/modemhold.c
          aarch64-linux-gnu-gcc -O2 -static -Wall -Wextra -o out/pdr-restart wlfwd/pdr-restart.c || true

          # pd-mapper is what tells the modem which protection domains exist
          # and where their firmware is; without it the WLAN domain never
          # starts and its service never appears on the name service. Its JSON
          # reader includes the xz header without using it, and the phone's
          # domain files are plain, so the decompressor is stubbed out.
          echo '/* not needed: the domain files here are plain */' > out/fake/lzma.h
          cat > out/fake/lzma_decomp.c <<'EOF'
          int lzma_decomp(const char *file) { (void)file; return -1; }
          EOF
          aarch64-linux-gnu-gcc -O2 -static -Wall \
            -I out/fake -I qrtr-1.2/include -I pd-mapper \
            -o out/pd-mapper \
            pd-mapper/pd-mapper.c pd-mapper/assoc.c pd-mapper/json.c \
            pd-mapper/servreg_loc.c out/fake/lzma_decomp.c \
            qrtr-1.2/lib/qrtr.c qrtr-1.2/lib/qmi.c qrtr-1.2/lib/logging.c 2>&1 | head -50 || true

          # rmtfs hands the modem the files it asks for over shared memory, and
          # tqftpserv serves the images it fetches over the network: the two
          # services a protection domain needs before it can start.
          aarch64-linux-gnu-gcc -O2 -static -Wall \
            -I qrtr-1.2/include -I rmtfs \
            -o out/rmtfs \
            rmtfs/rmtfs.c rmtfs/qmi_rmtfs.c rmtfs/qmi_tlv.c rmtfs/storage.c \
            rmtfs/sharedmem.c rmtfs/util.c rmtfs/rproc.c \
            qrtr-1.2/lib/qrtr.c qrtr-1.2/lib/qmi.c qrtr-1.2/lib/logging.c 2>&1 | head -30 || true
          aarch64-linux-gnu-gcc -O2 -static -Wall \
            -I qrtr-1.2/include -I tqftpserv \
            -o out/tqftpserv \
            tqftpserv/*.c \
            qrtr-1.2/lib/qrtr.c qrtr-1.2/lib/qmi.c qrtr-1.2/lib/logging.c 2>&1 | head -30 || true
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: wlfwd
          path: out/
          if-no-files-found: error
          retention-days: 30
