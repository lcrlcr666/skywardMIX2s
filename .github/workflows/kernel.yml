name: Kernel

# Builds the phone's own kernel with its WLAN driver as a module: the driver
# built into the kernel asks for its firmware before any partition is mounted,
# and never comes up in a recovery. As a module it is loaded after the vendor
# partition is, which is what Android itself does.
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source (owner/name)"
        required: false
        default: "meuira/android_kernel_xiaomi_sdm845"
      kernel_ref:
        description: "Branch or tag of that source"
        required: false
        default: "staging"
      defconfig:
        description: "Defconfig in that source"
        required: false
        default: "vendor/xiaomi/mi845_defconfig"
      fragment:
        description: "Configuration fragment for the device"
        required: false
        default: "vendor/xiaomi/polaris.config"

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabihf-

jobs:
  kernel:
    name: Build the kernel and its WLAN module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Get the kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.kernel_repo || 'meuira/android_kernel_xiaomi_sdm845' }}
          ref: ${{ inputs.kernel_ref || 'staging' }}
          path: ksrc
          fetch-depth: 1
          submodules: recursive

      - name: Install the toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf clang lld llvm make zip
          clang --version | head -2
          # A kernel build of this tree wants more room than the runner has left.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - name: Configure for this phone
        working-directory: ksrc
        run: |
          # The tree's own configuration for this phone, then the polaris
          # fragment beside it. The configuration taken from the phone's own
          # kernel belongs to another tree of sdm845, and its scheduler
          # symbols do not match this one's sources.
          make -j"$(nproc)" ARCH=$ARCH CC=clang LLVM=1 LLVM_IAS=1 O=out "${{ inputs.defconfig || 'vendor/xiaomi/mi845_defconfig' }}"
          # The fragments come in order, each over what the ones before set:
          # what the whole sdm845 family shares, then what is this phone's.
          for fragment in $(echo "${{ inputs.fragment || 'vendor/xiaomi/polaris.config' }}" | tr ',' ' '); do
            if [ -f "$fragment" ]; then
              echo "== $fragment"
              ARCH=$ARCH scripts/kconfig/merge_config.sh -m -O out out/.config "$fragment"
            fi
          done
          # The WLAN driver is the module this build exists for; the rest stays
          # as the phone's own configuration has it, sound included.
          scripts/config --file out/.config -m QCA_CLD_WLAN -e MODULES -e MODULE_UNLOAD
          # The tree is made buildable in place: the CPU-mask symbols get a
          # default, and the second cpu_util_freq of sched.h is kept out of a
          # build that has the windowed load tracking's own. Nothing of the
          # scheduler's behaviour changes, and the tracking stays on.
          python3 ../scripts/fix-kernel-tree.py .          # The secure shared-memory bridge is asked for by drivers that the
          # tree builds without the communicator it belongs to; a stub that
          # says "not here" lets them link and fail cleanly at run time.
          cat > drivers/misc/qtee_stub.c <<'EOF'
          #include <linux/kernel.h>
          #include <linux/errno.h>
          int qtee_shmbridge_allocate_shm(size_t nbytes, void *shm) { return -ENODEV; }
          void qtee_shmbridge_free_shm(void *shm) { }
          EOF
          grep -q qtee_stub drivers/misc/Makefile || echo 'obj-y += qtee_stub.o' >> drivers/misc/Makefile
          # The field is added here as well, and said out loud, so a tree that
          # did not take the patch is visible in the log rather than two builds
          # later.
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("include/linux/sched.h")
          t = p.read_text()
          if "trc_reader_need_end" not in t:
              t, n = re.subn(r"(struct task_struct \{)", r"\1\n\tbool\t\t\t\ttrc_reader_need_end;", t, count=1)
              if n:
                  p.write_text(t)
          print("task field present:", "trc_reader_need_end" in p.read_text())
          # The one place the traced RCU writes that field: it is left out, as
          # the struct it would write to is not the one this tree builds.
          q = pathlib.Path("kernel/rcu/tasks.h")
          if q.exists():
              lines = [l for l in q.read_text().splitlines(True) if "trc_reader_need_end" not in l]
              q.write_text("".join(lines))
              print("traced RCU write left out:", "trc_reader_need_end" not in q.read_text())
          PY
          # The four little cores of this phone are 0-3 and its four big ones
          # 4-7: the masks say which is which, and a build that leaves both at
          # zero hands the scheduler a topology the phone cannot start with.
          scripts/config --file out/.config --set-val LITTLE_CPU_MASK 15 --set-val BIG_CPU_MASK 240
          # Additions this tree carries that a recovery has no use for, and
          # that do not compile against its own older interfaces.
          for sym in WIREGUARD KSU BBG NOMOUNT TRACEFS_EXTRA DEBUG_INFO DEBUG_VM DEBUG_VM_PGFLAGS KVM VHOST MODVERSIONS BPF BPF_SYSCALL BPF_JIT DEBUG_INFO_BTF KEXEC KEXEC_FILE KEXEC_CORE TASKS_TRACE_RCU TASKS_RCU NFS_FS NFS_V3 NFS_V4 NFSD CIFS CEPH FANOTIFY FANOTIFY_ACCESS_PERMISSIONS TRANSPARENT_HUGEPAGE TRANSPARENT_HUGEPAGE_ALWAYS TRANSPARENT_HUGEPAGE_MADVISE MSM_GCC_8994 MSM_GCC_8996 MSM_MMCC_8996 MSM_GCC_8998 DRM_NOUVEAU DRM_MESON DRM_AMDGPU DRM_I915 DRM_RADEON DRM_AST DRM_MGAG200 DRM_CIRRUS_QEMU DRM_QXL DRM_BOCHS DRM_UDL DRM_VIRTIO_GPU DRM_VMWGFX DRM_I2C_CH7006 DRM_I2C_SIL164 DRM_I2C_ADV7511 DRM_I2C_TDA998X MEDIA_SUPPORT MEDIA_CONTROLLER VIDEO_DEV DVB_CORE SND_SOC INFINIBAND ATM HAMRADIO ISDN WIMAX XEN VIRTUALIZATION PCIE_DW_PLAT BRCMFMAC BRCM80211 MWIFIEX RTL8XXXU RTL8188EU ATH6KL ATH10K WLAN_VENDOR_BROADCOM WLAN_VENDOR_MARVELL WLAN_VENDOR_REALTEK WLAN_VENDOR_ATH WLAN_VENDOR_INTEL WLAN_VENDOR_MEDIATEK WLAN_VENDOR_TI SCSI_UFS_HISI SCSI_UFS_EXYNOS SCSI_UFS_MEDIATEK SCSI_UFS_BSG SCSI_UFS_FAULT_INJECTION; do
            scripts/config --file out/.config -d "$sym" || true
          done
          # The WLAN bring-up needs the QMI interface and the firmware service
          # that icnss speaks over it. The phone's own configuration asks for
          # them; the build asks again in case the asks were dropped.
          for sym in MSM_QMI_INTERFACE ICNSS IPC_ROUTER IPC_ROUTER_SECURITY MSM_IPC_ROUTER_GLINK_XPRT MSM_GLINK MSM_SMD QCOM_SMD QRTR QRTR_SMD REMOTEPROC QCOM_RMTFS_MEM QCOM_RPROC_COMMON REGULATOR REGULATOR_FIXED_VOLTAGE QCOM_TEE TEE MFD_SPMI_PMIC; do
            scripts/config --file out/.config -e "$sym" || true
          done
          make -j"$(nproc)" ARCH=$ARCH CC=clang LLVM=1 LLVM_IAS=1 O=out olddefconfig
          grep -E '^CONFIG_(QCA_CLD_WLAN|MODULES|MSM_QMI_INTERFACE|ICNSS|LITTLE_CPU_MASK|BIG_CPU_MASK)' out/.config | head -8

      - name: Build
        working-directory: ksrc
        run: |
          set +e
          make -j"$(nproc)" ARCH=$ARCH CC=clang LLVM=1 LLVM_IAS=1 O=out KCFLAGS=-Wno-error Image.gz modules > build.log 2>&1
          code=$?
          # The device trees this kernel is meant to run with: another board's
          # failing one does not stop the build, and what came out is kept.
          make -j"$(nproc)" ARCH=$ARCH CC=clang LLVM=1 LLVM_IAS=1 O=out KCFLAGS=-Wno-error dtbs >> build.log 2>&1
          echo "dtbs ended with $?"
          echo "make ended with $code"
          df -h / | tail -1
          echo '== the first errors =='
          grep -n -i -m 5 -B4 -A16 'error' build.log | head -140 || true
          echo '== the tail =='
          tail -150 build.log
          echo "make ended with $code"
          test $code -eq 0

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: ksrc/build.log
          if-no-files-found: warn

      - name: Gather what the recovery needs
        run: |
          mkdir -p kernel-out
          cp ksrc/out/arch/arm64/boot/Image.gz kernel-out/ || true
          cp ksrc/out/arch/arm64/boot/Image.gz-dtb kernel-out/ 2>/dev/null || true
          # The module goes into the recovery exactly as its kernel was built
          # with it: stripping it leaves its symbol versions out of step, and
          # the kernel refuses it with "disagrees about module_layout". The
          # build already leaves debugging information out.
          wlan="$(find ksrc/out -name 'wlan.ko' | head -1)"
          if [ -n "$wlan" ]; then
            cp "$wlan" kernel-out/qca_cld3_wlan.ko
            ls -l kernel-out/qca_cld3_wlan.ko
          fi
          find ksrc/out -name '*.ko' -print > kernel-out/modules.txt
          # The device trees this kernel was configured with, for the boards
          # of this phone: the blob a Qualcomm boot image carries after the
          # kernel is these, one after another.
          find ksrc/out/arch/arm64/boot/dts -name 'polaris*.dtb' -print | sort > kernel-out/dtbs.txt
          tar -C ksrc/out/arch/arm64/boot/dts -cf kernel-out/polaris-dtbs.tar \
            $(find ksrc/out/arch/arm64/boot/dts -name 'polaris*.dtb' -printf '%P\n' | sort) 2>/dev/null || true
          wc -l < kernel-out/dtbs.txt
          grep -i wlan kernel-out/modules.txt || true
          ls -l kernel-out

      - uses: actions/upload-artifact@v4
        with:
          name: polaris-kernel
          path: kernel-out/
          if-no-files-found: error
          retention-days: 30
