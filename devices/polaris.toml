[device]
codename = "polaris"
brand = "Xiaomi"
model = "Xiaomi Mi MIX 2S"
# A-only: one boot and one recovery partition, and no dynamic partitions.
ab = false
soc = { hans = "骁龙®845移动平台", hant = "Snapdragon® 845 行動平台", en = "Snapdragon® 845 Mobile Platform" }
os_version_prop = "ro.build.version.incremental"
# The pages start in Simplified Chinese unless the system asks for another.
locale = "zh-CN"

[display]
# 5.99 inches, 18.7:9; the panel reports 1080x2160 and the image is built on
# a recovery whose own frame is 1080x2248.
width = 1080
height = 2160
density = 440
diagonal = 5.99

# Android 9 and 10 keep their kernel modules in the vendor partition, in
# /vendor/lib/modules, the only place the stock recovery loads them from.
[modules]
sources = ["vendor"]

# The ramdisk IS /system here: it carries the recovery's own /system/bin,
# /system/lib64 and the program that is running. Mounting the installed
# system over that takes the recovery out from under itself — the shell and
# every library under /system stop resolving — so only the vendor partition
# is mounted, where the phone's own table and its drivers are.
[partitions]
mounted = []

# The baseband's settings and the sensors' calibration, as every Xiaomi
# phone of this generation keeps them.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]

# The phone's own WLAN: the driver is the module built beside the kernel this
# image carries and put in the ramdisk, its firmware comes from the modem
# partition, and the phone's own wpa_supplicant joins the networks.
[wlan]
modules = ["qca_cld3_wlan"]
interface = "wlan0"
supplicant = "/mnt/vendor/bin/hw/wpa_supplicant"
libraries = ["/mnt/vendor/lib64", "/mnt/vendor/lib64/hw"]
service = "wpa_supplicant"
probe = "http://connectivitycheck.gstatic.com/generate_204"

[update]
server = "https://update.miui.com/updates/miotaV3.php"
